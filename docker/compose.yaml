# Normally started by docker/deploy.sh (checks the machine, pulls the pinned image, starts, waits for READY). By hand:
#   SECAI_SERVING_IMAGE=<repo@digest from docker/release.env> docker compose -f docker/compose.yaml up -d
# Host: 2x RTX PRO 6000 (NVIDIA driver with CUDA >= 13.2, nvidia-container-toolkit); run docker/preflight.sh first. Put the API key in $SECAI_WORKSPACE/api.key (chmod 600). The image already contains the
# models; $SECAI_WORKSPACE keeps logs, the compile cache and the NVMe KV tier.
services:
  serving:
    container_name: secai-serving
    image: ${SECAI_SERVING_IMAGE:?use docker/deploy.sh, or set SECAI_SERVING_IMAGE to repo@digest from docker/release.env}
    init: true
    restart: unless-stopped
    network_mode: host        # same port layout as a bare host: 8005/8000/8002/8004 public, OCR 18083 loopback only
    shm_size: 120gb           # 2x55 GiB pinned KV offload lives in /dev/shm (+ headroom); the host needs the RAM too
    ulimits:
      memlock: -1
    environment:
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      STARTUP: ${STARTUP:-auto}
    volumes:
      - ${SECAI_WORKSPACE:-/srv/secai-serving}:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8005/health"]
      interval: 30s
      timeout: 10s
      start_period: 40m
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: "5"}
