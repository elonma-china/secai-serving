# Two single-GPU LLM replicas. Agentic sessions are pinned to one replica by X-Session-Id so
# the GPU prefix cache and RAM-offloaded KV are reused; requests without the header spread randomly.
map $http_x_session_id $llm_affinity {
    default $http_x_session_id;
    ""      $request_id;
}
upstream secai_llm {
    hash $llm_affinity consistent;
    server 127.0.0.1:8001 weight=5 max_fails=3 fail_timeout=30s;   # weights follow KV capacity (A 1.25M tokens, B ~0.83M: B shares its GPU with the aux models)
    server 127.0.0.1:8003 weight=4 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
server {
    listen 8005;
    client_max_body_size 64M;
    location / {
        proxy_pass http://secai_llm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
    }
}
